[project]
name = "stackshot"
version = "0.1.0"
description = "Convert Markdown, HTML, PDF, and PowerPoint files into one vertical PNG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pillow>=10.0.0",
    "playwright>=1.40.0",
    "pymupdf>=1.23.0",
]

[project.scripts]
stackshot = "stackshot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackshot"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
